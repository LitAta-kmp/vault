# Здесь только отличия от стандартной конфигурации detekt.
# Остальные правила берутся из дефолтного набора (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    # Composable-функции по соглашению пишутся с заглавной буквы
    ignoreAnnotated: ['Composable']
    # Тесты называем через подчёркивание. Свой список excludes заменяет стандартный,
    # поэтому перечислены и стандартные папки тестов, и наши androidHostTest/androidDeviceTest
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'

complexity:
  LongParameterList:
    # У экранов Compose много параметров (состояние, колбэки, modifier) — это нормально
    ignoreAnnotated: ['Composable']
